<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #000000;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 30px;
        }

        form {
            max-width: 900px;
        }

        fieldset {
            border: 1px solid #999999;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 25px;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            padding: 0 10px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            flex: none;
            width: 100%;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        label .required {
            color: red;
            margin-left: 2px;
        }

        input, select {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #767676;
            border-radius: 4px;
            background-color: #fff;
            color: #000;
            outline: none;
            box-sizing: border-box;
            height: 38px;
        }

        input::placeholder {
            color: #757575;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .checkbox-container input {
            height: auto;
            margin: 0;
        }

        .checkbox-container a {
            color: blue;
            text-decoration: underline;
        }

        button {
            background-color: #efefef;
            color: #000000;
            border: 1px solid #767676;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body>

    <h1>Sistema de Cadastro</h1>
    <p class="subtitle">Preencha todos os campos abaixo para concluir seu cadastro.</p>

    <form>
        <!-- Dados Pessoais -->
        <fieldset>
            <legend>Dados Pessoais</legend>
            <div class="row">
                <div class="form-group">
                    <label>Nome completo <span class="required">*</span></label>
                    <input type="text" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>Data de nascimento <span class="required">*</span></label>
                    <input type="date" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>CPF <span class="required">*</span></label>
                    <input type="text" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label>RG <span class="required">*</span></label>
                    <input type="text" placeholder="Digite seu RG" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Sexo <span class="required">*</span></label>
                    <select required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Contato -->
        <fieldset>
            <legend>Contato</legend>
            <div class="row">
                <div class="form-group">
                    <label>E-mail <span class="required">*</span></label>
                    <input type="email" placeholder="exemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label>Telefone <span class="required">*</span></label>
                    <input type="tel" placeholder="(99) 99999-9999" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group full-width">
                    <label>Endereço <span class="required">*</span></label>
                    <input type="text" placeholder="Digite seu endereço completo" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Cidade <span class="required">*</span></label>
                    <input type="text" placeholder="Digite sua cidade" required>
                </div>
                <div class="form-group">
                    <label>Estado <span class="required">*</span></label>
                    <select required>
                        <option value="">Selecione</option>
                        <!-- Adicione as opções de estados se necessário -->
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Acesso -->
        <fieldset>
            <legend>Acesso</legend>
            <div class="row">
                <div class="form-group">
                    <label>Senha <span class="required">*</span></label>
                    <input type="password" placeholder="Digite sua senha" required>
                </div>
                <div class="form-group">
                    <label>Confirme a senha <span class="required">*</span></label>
                    <input type="password" placeholder="Repita sua senha" required>
                </div>
            </div>
        </fieldset>

        <!-- Informações Adicionais -->
        <fieldset>
            <legend>Informações Adicionais</legend>
            <div class="row">
                <div class="form-group">
                    <label>Profissão</label>
                    <input type="text" placeholder="Digite sua profissão">
                </div>
                <div class="form-group">
                    <label>Como você nos conheceu?</label>
                    <select>
                        <option value="">Selecione</option>
                        <option value="google">Google</option>
                        <option value="redes-sociais">Redes Sociais</option>
                        <option value="amigo">Indicação de amigo</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Termos de Uso -->
        <div class="checkbox-container">
            <input type="checkbox" id="termos" required>
            <label for="termos" style="font-weight: normal; margin: 0;">
                Li e aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.
            </label>
        </div>

        <!-- Botão Cadastrar -->
        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
